// Claudeランチャーのビルド（v2.3〜 Gradle）。
// プッシュ通知（Firebase Cloud Messaging）のライブラリが要るので、手組みの build.sh から移した。
// ソースの置き場所は昔のまま（src/ res/ AndroidManifest.xml が直下）。
plugins {
    id 'com.android.application' version '8.12.3'
}

// バージョンは今までどおり AndroidManifest.xml に書く（1か所で済ませるため、ここで読む）
def manifestText = file('AndroidManifest.xml').getText('UTF-8')
def vCode = (manifestText =~ /versionCode="(\d+)"/)[0][1] as int
def vName = (manifestText =~ /versionName="([^"]+)"/)[0][1]

android {
    namespace 'com.rerise.claudelauncher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rerise.claudelauncher'
        minSdk 29
        targetSdk 35
        versionCode vCode
        versionName vName
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        // 今までと同じ鍵で署名する（鍵が変わると上書き更新できなくなる）。
        // debug.keystore は GitHub Secret から復元される。リポジトリには入れない。
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}
