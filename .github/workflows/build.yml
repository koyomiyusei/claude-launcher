name: build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'proguard-rules.pro'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 署名鍵を復元（Secretから。リポジトリには入れない）
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::DEBUG_KEYSTORE_B64 が未設定"; exit 1; fi
          echo "$KS_B64" | base64 -d > debug.keystore

      - name: ビルド（Gradle）
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/ClaudeLauncher-release.apk ClaudeLauncher.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | grep -v rc | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs ClaudeLauncher.apk | grep -E "SHA-256|DN"

      - name: latest.json のバージョンをマニフェストに合わせる
        run: |
          python3 - <<'PY'
          import json, re
          m = open('AndroidManifest.xml', encoding='utf-8').read()
          vc = int(re.search(r'versionCode="(\d+)"', m).group(1))
          vn = re.search(r'versionName="([^"]+)"', m).group(1)
          d = json.load(open('latest.json', encoding='utf-8'))
          d['versionCode'], d['versionName'] = vc, vn
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(d, f, ensure_ascii=False, indent=2); f.write('\n')
          print(f'latest.json -> {vc} / {vn}')
          PY

      - name: 鍵を消す
        if: always()
        run: rm -f debug.keystore

      - name: APKと latest.json をリポジトリに戻す
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClaudeLauncher.apk latest.json
          git commit -m "Build APK [skip ci]" || { echo "変更なし"; exit 0; }
          git push
